name: Fetch sample covers for screenshots
on:
  push:
    branches: [tour-covers]
    paths: [tour-covers/items.json, tour-covers/fetch.mjs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tour-covers/fetch.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tour-covers/img tour-covers/report.txt
          git commit -m "Sample covers for screenshots" || echo "nothing new"
          git push
